# Base OpenAPI document merged into the generated spec by io.swagger.core.v3:swagger-maven-plugin.
# It seeds the info block (version stamped from the POM via resource filtering) and the api_key
# security scheme that every resource class references with @SecurityRequirement(name = "api_key").
openapi: 3.0.1
info:
  title: CEDAR Terminology Server API
  description: CEDAR Terminology Server API
  version: ${project.version}
components:
  schemas:
    # An envelope the generator cannot see: the integrated-search handler builds this one by hand
    # rather than through CedarResponse.
    PinnedVersionUnavailableError:
      type: object
      description: >-
        A constraint pins a vocabulary version the store cannot serve. The read fails rather than
        resolving against the current version, so a published template never silently changes what
        it offers.
      required:
        - errorType
        - message
      properties:
        errorType:
          type: string
          enum: [PinnedVersionUnavailable]
        message:
          type: string
      additionalProperties: false
  securitySchemes:
    api_key:
      type: apiKey
      name: Authorization
      in: header
      description: "Your CEDAR API key, using the format 'apiKey <yourApiKey>'"
