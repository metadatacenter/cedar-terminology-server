        in: path
        name: id
        required: true
        schema:
          type: string
      - description: "BioPortal ontology identifier. Examples: NCIT, FMA, OBI."
        in: path
        name: ontology
        required: true
        schema:
          type: string
      - description: Optional BCP-47 language for the returned label (e.g. fr). Honored
          for locally-served ontologies; ignored for BioPortal-proxied ones.
        in: query
        name: lang
        schema:
          type: string
      responses:
        "200":
