          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Get all provisional classes in a particular ontology
      tags:
      - Classes
  /bioportal/ontologies/{ontology}/classes/roots:
    get:
      description: "Get root classes in a particular ontology. For the CEDARPC ontology,\
        \ all provisional classes in it will be returned."
      operationId: findRootClasses
      parameters:
