  /search:
    post:
      description: "Search the local terminology store at a named version or the current\
        \ one, across the constraint types a controlled-term field can carry: ontology,\
        \ branch, class and valueSet. Returns per-type counts and each type's first\
        \ page, and describes every source it searched — the version that answered,\
        \ and whether a constraint on it can be pinned."
      operationId: versionAwareSearch
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: "Results, and the sources that produced them"
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: A request the server will not answer
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No local terminology store is configured
      summary: Version-aware search
      tags:
      - Search
  /search/hierarchy:
    get:
      description: "The chain of ancestors above a term, root first, and what hangs\
        \ directly below it. A search result names a term; whether it is the right\
        \ term is a question about its neighbourhood, and two concepts with one label\
        \ are told apart by nothing else. With versionId, answered from that release's\
        \ snapshot: a hierarchy belongs to a release, and a term's parent can move\
        \ between two of them. Without it, from the cross-snapshot index, which holds\
        \ each ontology's current version. Children are alphabetical and capped; offset\
        \ asks for the next page of them."
      operationId: versionAwareSearchHierarchy
      parameters:
      - in: query
        name: sourceAcronym
        schema:
          type: string
      - in: query
        name: termIri
        schema:
          type: string
      - in: query
        name: versionId
        schema:
          type: string
      - in: query
        name: offset
        schema:
          type: integer
          format: int32
          default: 0
      responses:
        "200":
          description: The term's ancestors and children
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: A request naming no term
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: "No such release, a release without that term, or a term the\
            \ index does not hold"
        "503":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: No local terminology store is configured
      summary: Where a term sits in its ontology
      tags:
      - Search
