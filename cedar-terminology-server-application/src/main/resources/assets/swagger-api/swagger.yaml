openapi: 3.0.1
info:
  description: CEDAR Terminology Server API
  title: CEDAR Terminology Server API
  version: 2.9.8
paths:
  /bioportal/classes/provisional:
    get:
      description: Get provisional classes (including provisional value sets and provisional
        values).
      operationId: findAllProvisionalClasses
      parameters:
      - description: "Page to be returned. Example: 7."
        in: query
        name: page
        schema:
          type: integer
          format: int32
          default: 1
      - description: "Number of results per page. Example: 10."
        in: query
        name: pageSize
        schema:
          type: integer
          format: int32
      - description: "Alias for the page size, accepted in either spelling."
        in: query
        name: page_size
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: Successful operation
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Get provisional classes
      tags:
      - Classes
  /bioportal/classes/version-current:
    get:
      description: "The version triple of the ontology that owns the given class/term\
        \ IRI — the freeze-on-publish capability for a class-valued constraint, which\
        \ names a term but not its ontology. The IRI's namespace is mapped to its\
        \ ontology, then that ontology's current triple is returned. 404 when the\
        \ ontology cannot be determined unambiguously or is not served locally."
      operationId: resolveCurrentVersionForClass
      parameters:
      - description: "Class/term IRI. Example: http://purl.obolibrary.org/obo/DOID_9351."
        in: query
        name: uri
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successful operation
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Ontology for the class not resolvable locally
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Resolve the current version triple for a class IRI
      tags:
      - Classes
      - Ontologies
  /bioportal/integrated-retrieve:
    post:
      description: "Retrieve ontology classes, value sets, and values based on CEDAR\
        \ value constraints. This endpoint takes a controlled term field specification\
        \ and any user-supplied initial characters and returns conforming values.\
        \ <br /> <br /> Some sample calls in Insomnia (https://insomnia.rest/) format\
        \ are available at https://github.com/metadatacenter/cedar-util/blob/master/api-calls/CEDAR_Insomnia_API_calls.json.\
        \ <br /> <br />Note that in some cases, the server will need to sort the results\
        \ obtained from BioPortal and the original pagination information will not\
        \ be valid any more. In those situations, the values of some of the pagination\
        \ fields returned as part of the results (e.g., pageCount, nextPage, etc.)\
        \ cannot be computed consistently, and the server will assign a 'null' value\
        \ to those fields."
      operationId: cedarIntegratedRetrieve
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegratedRetrieveRequestBody"
        description: Object that encapsulates the information needed to run the search
          query. The "valueConstraints" field specification is based on CEDAR's "_valueConstraints"
          field. See https://more.metadatacenter.org/tools-training/outreach/cedar-template-model
          for more details.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegratedRetrieveResults"
          description: A paginated list of search results
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Retrieve classes and values based on CEDAR value constraints
      tags:
      - Classes
      - Value sets
      - Values
  /bioportal/integrated-search:
    post:
      description: "Search for ontology classes, value sets, and values based on CEDAR\
        \ value constraints. This endpoint takes a controlled term field specification\
        \ and any user-supplied initial characters and returns conforming values.\
        \ <br /> <br /> Some sample calls in Insomnia (https://insomnia.rest/) format\
        \ are available at https://github.com/metadatacenter/cedar-util/blob/master/api-calls/CEDAR_Insomnia_API_calls.json.\
        \ <br /> <br />Note that in some cases, the server will need to sort the results\
        \ obtained from BioPortal and the original pagination information will not\
        \ be valid any more. In those situations, the values of some of the pagination\
        \ fields returned as part of the results (e.g., pageCount, nextPage, etc.)\
        \ cannot be computed consistently, and the server will assign a 'null' value\
        \ to those fields."
      operationId: cedarIntegratedSearch
      parameters:
      - description: "Optional BCP-47 language for result labels (e.g. fr). Honored\
          \ for locally-served, single-source constraints; ignored for BioPortal-proxied\
          \ ones."
        in: query
        name: lang
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/IntegratedSearchRequestBody"
        description: Object that encapsulates the information needed to run the search
          query. The "valueConstraints" field specification is based on CEDAR's "_valueConstraints"
          field. See https://more.metadatacenter.org/tools-training/outreach/cedar-template-model
          for more details.
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegratedSearchResults"
          description: A paginated list of search results
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "422":
          description: A constraint pins a vocabulary version that cannot be served
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Search for classes and values based on CEDAR value constraints
      tags:
      - Classes
      - Value sets
      - Values
  /bioportal/ontologies:
    get:
      description: Find all ontologies.
      operationId: findAllOntologies
      responses:
        "200":
          description: Successful operation
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Find all ontologies
      tags:
      - Ontologies
  /bioportal/ontologies/{id}:
    get:
      description: Find ontology by id.
      operationId: findOntology
      parameters:
      - description: "BioPortal ontology identifier. Examples: NCIT, FMA, OBI."
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successful operation
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Find ontology by id
      tags:
      - Ontologies
  /bioportal/ontologies/{id}/versions:
    get:
      description: "Versions of an ontology available in the local, version-pinned\
        \ store, each with its content-hash id, self-declared version, release timestamp,\
        \ effectiveDate (the release day, or ingest day when the source records no\
        \ release), and whether it is the current one. Empty when the ontology is\
        \ served from BioPortal (which has no equivalent)."
      operationId: getVersions
      parameters:
      - description: "Ontology acronym. Examples: DOID, INCENTIVE."
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successful operation
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: List local versions of an ontology
      tags:
      - Ontologies
  /bioportal/ontologies/{id}/versions/current:
    get:
      description: "The version triple {id (content hash), effectiveDate, declaredVersion}\
        \ of the ontology's current (latest) local snapshot. This is the publish-time\
        \ 'resolve current' capability: a publish pipeline calls it per value-constraint\
        \ entry to freeze the entry against its ontology's current state. 404 when\
        \ the ontology is not served locally (BioPortal has no content-hash triple\
        \ to freeze)."
      operationId: resolveCurrentVersion
      parameters:
      - description: "Ontology acronym. Examples: DOID, INCENTIVE."
        in: path
        name: id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successful operation
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Ontology not served locally
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Resolve the current version triple of an ontology
      tags:
      - Ontologies
  /bioportal/ontologies/{id}/versions/diff:
    get:
      description: "The vocabulary diff (concept and subsumption-edge additions/removals,\
        \ newly obsoleted, capped concept samples) between two versions in the local\
        \ store, given by version_id or tag. 404 when the ontology or a version is\
        \ not served locally."
      operationId: diffVersions
      parameters:
      - description: Ontology acronym.
        in: path
        name: id
        required: true
        schema:
          type: string
      - description: Base version (version_id or tag).
        in: query
        name: from
        required: true
        schema:
          type: string
      - description: "Target version (version_id or tag, e.g. latest)."
        in: query
        name: to
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successful operation
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Unauthorized
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Ontology or version not found locally
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Diff two local versions of an ontology
      tags:
      - Ontologies
  /bioportal/ontologies/{ontology}/classes:
    get:
      description: Get all classes from a specific ontology (including both regular
