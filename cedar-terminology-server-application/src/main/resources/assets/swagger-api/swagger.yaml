          description: Not found
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CedarError"
          description: Internal server error
      security:
      - api_key: []
      summary: Get classes
      tags:
      - Classes
  /bioportal/ontologies/{ontology}/classes/provisional:
